name: NBA halftime alerts

on:
  schedule:
    # Two runs a day, each watching for about 6 hours.
    # Times are UTC: 17:00 UTC = 1 PM Eastern (during daylight time) and
    # 23:00 UTC = 7 PM Eastern. Together they cover roughly 1 PM to 1 AM ET.
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # lets you start it by hand from the Actions tab

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch for halftime
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEAMS: ${{ vars.TEAMS }}
          RUN_MINUTES: "345"
          POLL_SECONDS: "30"
        run: python notify.py
